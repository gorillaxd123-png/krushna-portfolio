<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: #1e1e24;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #ff7b00;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0ab;
            font-size: 1.1rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        /* Tooltip Container */
        .social-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #2b2b36;
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-5px);
            background-color: #ff7b00;
        }

        /* Pop-up / Tooltip Style */
        .tooltip {
            visibility: hidden;
            opacity: 0;
            width: 120px;
            background-color: #333340;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 6px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%; /* Position above the button */
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }

        /* Tooltip Arrow */
        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333340 transparent transparent transparent;
        }

        /* Show Tooltip on Hover */
        .social-btn-wrapper:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎨 Art Studio</h1>
            <p>Welcome to our creative hub! Explore artworks, live streams, and community events.</p>
        </div>

        <div class="social-links">
            <!-- Discord -->
            <div class="social-btn-wrapper">
                <a href="#" class="social-btn">💬</a>
                <span class="tooltip">Join Discord</span>
            </div>

            <!-- YouTube -->
            <div class="social-btn-wrapper">
                <a href="#" class="social-btn">▶</a>
                <span class="tooltip">Watch YouTube</span>
            </div>

            <!-- Twitch -->
            <div class="social-btn-wrapper">
                <a href="#" class="social-btn">👾</a>
                <span class="tooltip">Follow Twitch</span>
            </div>
        </div>
    </div>

</body>
</html>
