<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FPS Game Hub</title>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0d0f12;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* Top Bar Header */
    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 27, 34, 0.8);
      padding: 1rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    /* Profile / Status Section */
    .profile-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 136, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      cursor: pointer;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }

    /* Speech Bubble for Online Status */
    .speech-bubble {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: #00ff88;
      color: #0d0f12;
      padding: 4px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
      pointer-events: none;
    }

    /* Speech Bubble Arrow */
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 6px 6px 6px;
      border-style: solid;
      border-color: transparent transparent #00ff88 transparent;
    }

    .status-badge:hover .speech-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Contact Me Header Button */
    .contact-btn {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    .contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.7);
    }

    /* Main Menu Cards Container */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 900px;
      margin: auto 0;
    }

    /* Menu Card Styles */
    .card {
      background: rgba(22, 27, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Always Visible Color & Shine Effect on Icons */
    .card i {
      font-size: 3.5rem;
      position: relative;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    /* Vibrant Base Colors & Continuous Shine */
    .card-play i {
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
      animation: iconShineGreen 2.5s infinite alternate ease-in-out;
    }

    .card-options i {
      color: #00ccff;
      text-shadow: 0 0 15px rgba(0, 204, 255, 0.6);
      animation: iconShineBlue 2.5s infinite alternate ease-in-out;
    }

    .card-friends i {
      color: #ff0077;
      text-shadow: 0 0 15px rgba(255, 0, 119, 0.6);
      animation: iconShinePink 2.5s infinite alternate ease-in-out;
    }

    /* Icon Shine Animations */
    @keyframes iconShineGreen {
      0% { filter: brightness(1) drop-shadow(0 0 2px #00ff88); }
      100% { filter: brightness(1.4) drop-shadow(0 0 12px #00ff88); }
    }

    @keyframes iconShineBlue {
      0% { filter: brightness(1) drop-shadow(0 0 2px #00ccff); }
      100% { filter: brightness(1.4) drop-shadow(0 0 12px #00ccff); }
    }

    @keyframes iconShinePink {
      0% { filter: brightness(1) drop-shadow(0 0 2px #ff0077); }
      100% { filter: brightness(1.4) drop-shadow(0 0 12px #ff0077); }
    }

    .card:hover i {
      transform: scale(1.15);
    }

    .card span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Dialog Pop-up (Modal) Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #161b22;
      border: 1px solid rgba(255, 0, 85, 0.4);
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.2);
      transform: translateY(-20px);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h3 {
      font-size: 1.4rem;
      color: #ff0055;
    }

    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .info-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-item i {
      font-size: 1.2rem;
      color: #ff5500;
    }

    .info-item span {
      font-size: 0.95rem;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="profile-container">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Player</span>
        <!-- Chat bubble popup on hover -->
        <div class="speech-bubble">Online</div>
      </div>
    </div>
    
    <button class="contact-btn" id="openContact">Contact Me</button>
  </header>

  <!-- Main Game Navigation Grid -->
  <main class="menu-grid">
    <div class="card card-play">
      <i class="fa-solid fa-crosshairs"></i>
      <span>Play</span>
    </div>
    
    <div class="card card-options">
      <i class="fa-solid fa-sliders"></i>
      <span>Options</span>
    </div>
    
    <div class="card card-friends">
      <i class="fa-solid fa-user-group"></i>
      <span>Friends</span>
    </div>
  </main>

  <!-- Contact Me Modal Dialog -->
  <div class="modal-overlay" id="contactModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3><i class="fa-solid fa-address-card"></i> Get in Touch</h3>
        <button class="close-btn" id="closeContact">&times;</button>
      </div>
      <div class="contact-info">
        <div class="info-item">
          <i class="fa-solid fa-envelope"></i>
          <span>your-email@example.com</span>
        </div>
        <div class="info-item">
          <i class="fa-brands fa-discord"></i>
          <span>YourUsername#0000</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('contactModal');
    const openBtn = document.getElementById('openContact');
    const closeBtn = document.getElementById('closeContact');

    // Open Contact Modal
    openBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    // Close Contact Modal via Close Button
    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // Close Modal by clicking backdrop
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });
  </script>

</body>
</html>
