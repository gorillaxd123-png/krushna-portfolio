<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        .canvas-container {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            padding: 40px;
            box-sizing: border-box;
        }

        .works-section {
            width: 400px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
        }

        .works-section h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .work-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .work-card:hover {
            transform: translateY(-4px);
            border-color: #555;
        }

        .work-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <!-- Right side of the canvas: Works section -->
        <div class="works-section">
            <h2>Works</h2>
            
            <div class="work-card">
                <img src="https://github.com/gorillaxd123-png/krushna-portfolio/blob/main/I%20Found%20The%20Secret%20Of%20Thumbnailing.png?raw=true" alt="I Found The Secret Of Thumbnailing">
            </div>

            <div class="work-card">
                <img src="https://github.com/gorillaxd123-png/krushna-portfolio/blob/main/How%20Do%20To%20Modeling%20In%202026.png?raw=true" alt="How To Do Modeling In 2026">
            </div>

            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/qHlIYFZoT5w" 
                    title="How To Do The Best Rendering In 2026 ?" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

</body>
</html>
